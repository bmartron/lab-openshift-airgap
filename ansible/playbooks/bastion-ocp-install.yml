---
# Deploys install-config, agent-config, imageset, CA and pull-secret on the bastion.
# Run from the Mac: cd ansible && ansible-playbook playbooks/bastion-ocp-install.yml
#
# Prerequisites:
#   - lab-infra.yml already OK (DVD, DNS/gw eth0, oc/oc-mirror, /etc/hosts)
#   - ansible/files/pull-secret.txt — console.redhat.com
#   - ocp_topology + MACs in inventory/group_vars/all.yml (match terraform/lab-ocp)
#
# Cluster sshKey: taken live from bastion ~/.ssh/id_ed25519.pub (created by lab-ssh /
# lab-infra). No Mac install_ssh_key.pub file.
#
# Starts with lab-ssh.yml (bastion key → dns/registry/Proxmox + known_hosts cleanup)
# so redeploys do not leave Permission denied / host key changed.
#
# CA trust: replayed here (idempotent); already done by lab-infra bastion role.

- import_playbook: lab-ssh.yml

- name: Lire CA TLS registry
  hosts: registry
  gather_facts: false
  become: true
  tasks:
    - name: Slurp ca.crt
      ansible.builtin.slurp:
        src: "{{ registry_data_mount }}/certs/ca.crt"
      register: ocp_registry_ca_slurp

    - name: Exposer CA pour le play bastion
      ansible.builtin.set_fact:
        ocp_registry_ca_pem: "{{ ocp_registry_ca_slurp.content | b64decode }}"

- name: Bastion — configuration install OCP air-gap
  hosts: bastion
  gather_facts: false
  become: true
  # Single all.yml: inventory/group_vars (loaded by inventory + vars_files).
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all.yml"
  vars:
    ocp_pull_secret_path: "{{ playbook_dir }}/../files/pull-secret.txt"
    ocp_registry_ca_pem: "{{ hostvars['registry'].ocp_registry_ca_pem }}"
  pre_tasks:
    - name: Fusionner registry mirror dans pull secret (évite warning install)
      ansible.builtin.set_fact:
        ocp_pull_secret_json: "{{ _merged | to_json }}"
      vars:
        _ps: "{{ lookup('ansible.builtin.file', ocp_pull_secret_path) | from_json }}"
        _reg: "{{ registry_hostname }}:{{ registry_port }}"
        _auths: "{{ _ps.auths | default({}) | combine({_reg: (_ps.auths | default({}))[_reg] | default({'auth': 'Og=='})}) }}"
        _merged: "{{ _ps | combine({'auths': _auths}, recursive=True) }}"
      no_log: true
  roles:
    - role: ocp_bastion_install
