---
# Déploie install-config, agent-config, imageset, CA et pull-secret sur la bastion.
# Lance depuis le Mac : cd ansible && ansible-playbook playbooks/bastion-ocp-install.yml
#
# Prérequis locaux (ansible/files/) :
#   pull-secret.txt   — console.redhat.com
#   install_ssh_key.pub — clé publique SSH pour core@SNO (souvent clé Mac)
#
# group_vars : ocp_sno_mac (MAC Proxmox VM SNO)

- name: Lire CA TLS registry
  hosts: registry
  gather_facts: false
  become: true
  tasks:
    - name: Slurp ca.crt
      ansible.builtin.slurp:
        src: "{{ registry_data_mount }}/certs/ca.crt"
      register: ocp_registry_ca_slurp

    - name: Exposer CA pour le play bastion
      ansible.builtin.set_fact:
        ocp_registry_ca_pem: "{{ ocp_registry_ca_slurp.content | b64decode }}"

- name: Bastion — configuration install OCP air-gap
  hosts: bastion
  gather_facts: false
  become: true
  # Priorité sur inventory/group_vars — éditer souvent ansible/group_vars/all.yml
  # Dernier fichier gagne — préférer inventory/group_vars pour ocp_sno_mac
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/all.yml"
  vars:
    ocp_pull_secret_path: "{{ playbook_dir }}/../files/pull-secret.txt"
    ocp_ssh_pubkey_path: "{{ playbook_dir }}/../files/install_ssh_key.pub"
    ocp_registry_ca_pem: "{{ hostvars['registry'].ocp_registry_ca_pem }}"
    ocp_ssh_pubkey: "{{ lookup('ansible.builtin.file', ocp_ssh_pubkey_path) | trim }}"
  pre_tasks:
    - name: Fusionner registry mirror dans pull secret (évite warning install)
      ansible.builtin.set_fact:
        ocp_pull_secret_json: "{{ _merged | to_json }}"
      vars:
        _ps: "{{ lookup('ansible.builtin.file', ocp_pull_secret_path) | from_json }}"
        _reg: "{{ registry_hostname }}:{{ registry_port }}"
        _auths: "{{ _ps.auths | default({}) | combine({_reg: (_ps.auths | default({}))[_reg] | default({'auth': 'Og=='})}) }}"
        _merged: "{{ _ps | combine({'auths': _auths}, recursive=True) }}"
      no_log: true
  roles:
    - role: ocp_bastion_install
