---
- name: DNS
  hosts: dns
  become: true
  roles:
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: dns

- name: Registry
  hosts: registry
  become: true
  roles:
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: registry

- name: Bastion
  hosts: bastion
  become: true
  roles:
    # Pas de souscription RH : même repo DVD que dns/registry (ide2 → /dev/sr1)
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: bastion
