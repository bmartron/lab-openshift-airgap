---
# Lab infra: SSH trust first, then dns → registry → bastion.
# SSH-only re-run: playbooks/lab-ssh.yml

- import_playbook: lab-ssh.yml

- name: DNS
  hosts: dns
  become: true
  roles:
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: dns

- name: Registry
  hosts: registry
  become: true
  roles:
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: registry

- name: Bastion
  hosts: bastion
  become: true
  roles:
    # No RH subscription: same DVD repo as dns/registry (ide0)
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: bastion
