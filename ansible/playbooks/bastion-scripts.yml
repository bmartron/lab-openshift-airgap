---
# Copy useful lab scripts to ~/lab/scripts/ on bastion — no dnf / sudo.
# Mac: cd ansible && ansible-playbook playbooks/bastion-scripts.yml

- name: Lab scripts on bastion
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Scripts directory
      ansible.builtin.file:
        path: "{{ bastion_lab_dir }}/scripts"
        state: directory
        owner: "{{ lab_user }}"
        group: "{{ lab_user }}"
        mode: "0755"

    - name: Copy bastion scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../bastion/scripts/{{ item }}"
        dest: "{{ bastion_lab_dir }}/scripts/{{ item }}"
        owner: "{{ lab_user }}"
        group: "{{ lab_user }}"
        mode: "0755"
      loop:
        - lab-startup-check.sh
        - verify-mirror-before-sno.sh
        - pull-secret-for-oc-mirror.sh

    - name: Remove obsolete install-config helper scripts
      ansible.builtin.file:
        path: "{{ bastion_lab_dir }}/scripts/{{ item }}"
        state: absent
      loop:
        - install-config-embed-ca.sh
        - install-config-fix-pullsecret.sh
        - install-config-regenerate.sh
