---
# Registry seule : disque /opt/registry, TLS, image registry:2, conteneur Podman
# Prérequis : inventory/hosts.yml + group_vars/all.yml (registry_data_device, registry_image_tar)
- name: Registry mirror (lab air-gap)
  hosts: registry
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all.yml"
  become: true
  roles:
    - role: rhel_dvd
      when: rhel_dvd_repo_enable | default(true) | bool
    - role: common
    - role: registry
