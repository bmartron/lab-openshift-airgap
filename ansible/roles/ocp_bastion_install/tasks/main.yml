---
- name: Validate ocp_topology
  ansible.builtin.assert:
    that:
      - ocp_topology | default('sno') is in ['sno', 'compact3']
    fail_msg: >-
      ocp_topology must be "sno" or "compact3" (got {{ ocp_topology | default('') }})

- name: Build ocp_nodes for sno
  when:
    - (ocp_nodes | default([]) | length) == 0
    - ocp_topology | default('sno') == 'sno'
  ansible.builtin.set_fact:
    ocp_nodes:
      - hostname: "{{ ocp_sno_hostname }}"
        ip: "{{ ocp_sno_ip }}"
        mac: "{{ ocp_sno_mac }}"
        interface: "{{ ocp_sno_interface }}"
        root_device: "{{ ocp_sno_root_device }}"

- name: Build ocp_nodes for compact3
  when:
    - (ocp_nodes | default([]) | length) == 0
    - ocp_topology | default('sno') == 'compact3'
  ansible.builtin.set_fact:
    ocp_nodes: "{{ ocp_compact3_nodes }}"

- name: Override compact3 node0 MAC from ocp_sno_mac when set
  when:
    - ocp_topology | default('sno') == 'compact3'
    - ocp_sno_mac | default('') | length >= 17
    - (ocp_nodes | length) > 0
  ansible.builtin.set_fact:
    ocp_nodes: >-
      {{ [ocp_nodes[0] | combine({'mac': ocp_sno_mac})] + ocp_nodes[1:] }}

- name: Set control-plane replicas and rendezvous IP
  ansible.builtin.set_fact:
    ocp_control_plane_replicas: "{{ 1 if (ocp_topology | default('sno') == 'sno') else 3 }}"
    ocp_rendezvous_ip: "{{ ocp_nodes[0].ip }}"

- name: Validate each node MAC
  ansible.builtin.assert:
    that:
      - item.mac | default('') | length >= 17
      - item.mac is match('(?i)^[0-9a-f]{2}(:[0-9a-f]{2}){5}$')
    fail_msg: >-
      Invalid MAC for host {{ item.hostname | default('?') }} (got {{ item.mac | default('') }}).
      Set ocp_sno_mac (sno) or ocp_compact3_nodes / ocp_nodes (compact3) —
      must match terraform/lab-ocp. Proxmox: qm config <VMID> | grep net
  loop: "{{ ocp_nodes }}"
  loop_control:
    label: "{{ item.hostname | default(item.ip | default('node')) }}"

- name: Validate node count for topology
  ansible.builtin.assert:
    that:
      - (ocp_topology == 'sno' and (ocp_nodes | length) == 1)
        or (ocp_topology == 'compact3' and (ocp_nodes | length) == 3)
    fail_msg: >-
      ocp_topology={{ ocp_topology }} expects {{ 1 if ocp_topology == 'sno' else 3 }}
      host(s) in ocp_nodes, got {{ ocp_nodes | length }}

- name: Verify registry CA
  ansible.builtin.assert:
    that:
      - ocp_registry_ca_pem is defined
      - ocp_registry_ca_pem | length > 0
    fail_msg: >-
      CA absente — le play « registry » doit réussir (slurp ca.crt sur 172.16.10.20).

- name: Vérifier pull-secret (Mac)
  ansible.builtin.assert:
    that:
      - ocp_pull_secret_json is defined
      - ocp_pull_secret_json | length > 10
    fail_msg: >-
      Copy ansible/files/pull-secret.txt on the Mac — see ansible/files/README.md

- name: Ensure SSH directory for lab user
  ansible.builtin.file:
    path: "/home/{{ lab_user }}/.ssh"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0700"

- name: Ensure ed25519 key for lab user (SNO sshKey)
  become: true
  become_user: "{{ lab_user }}"
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -f /home/{{ lab_user }}/.ssh/id_ed25519
    creates: "/home/{{ lab_user }}/.ssh/id_ed25519"

- name: Read live bastion public key for install-config sshKey
  ansible.builtin.slurp:
    src: "/home/{{ lab_user }}/.ssh/id_ed25519.pub"
  register: ocp_ssh_pubkey_slurp

- name: Set ocp_ssh_pubkey from bastion
  ansible.builtin.set_fact:
    ocp_ssh_pubkey: "{{ ocp_ssh_pubkey_slurp.content | b64decode | trim }}"

- name: Vérifier clé SSH bastion
  ansible.builtin.assert:
    that:
      - ocp_ssh_pubkey is defined
      - ocp_ssh_pubkey | length > 20
      - ocp_ssh_pubkey is match('^ssh-(ed25519|rsa) ')
    fail_msg: >-
      Missing or invalid /home/{{ lab_user }}/.ssh/id_ed25519.pub on bastion.
      lab-infra proxmox_ssh should create it; regenerate ISO after bastion recreate.

- name: Répertoires lab OCP
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"
  loop:
    - "{{ ocp_install_dir }}"
    - "{{ ocp_config_backup_dir }}"
    - "{{ bastion_lab_dir }}/scripts"

- name: install-config.yaml (backup)
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ ocp_config_backup_dir }}/install-config.yaml"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"

- name: agent-config.yaml (backup)
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ ocp_config_backup_dir }}/agent-config.yaml"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"

- name: Copier configs vers répertoire install
  ansible.builtin.copy:
    src: "{{ ocp_config_backup_dir }}/{{ item }}"
    dest: "{{ ocp_install_dir }}/{{ item }}"
    remote_src: true
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"
  loop:
    - install-config.yaml
    - agent-config.yaml

- name: imageset-config.yaml
  ansible.builtin.template:
    src: imageset-config.yaml.j2
    dest: "{{ ocp_install_dir }}/imageset-config.yaml"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0644"

- name: pull-secret.txt sur bastion
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', ocp_pull_secret_path) }}"
    dest: "{{ bastion_lab_dir }}/pull-secret.txt"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"
  no_log: true

- name: Lab scripts (checks + oc-mirror auth)
  when: ocp_deploy_lab_scripts | bool
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../bastion/scripts/{{ item }}"
    dest: "{{ bastion_lab_dir }}/scripts/{{ item }}"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"
  loop:
    - lab-startup-check.sh
    - verify-mirror-before-sno.sh
    - pull-secret-for-oc-mirror.sh

- name: Remove obsolete install-config helper scripts
  when: ocp_deploy_lab_scripts | bool
  ansible.builtin.file:
    path: "{{ bastion_lab_dir }}/scripts/{{ item }}"
    state: absent
  loop:
    - install-config-embed-ca.sh
    - install-config-fix-pullsecret.sh
    - install-config-regenerate.sh

- name: pull-secret-oc-mirror.txt (Red Hat auth for oc-mirror)
  ansible.builtin.command:
    cmd: "{{ bastion_lab_dir }}/scripts/pull-secret-for-oc-mirror.sh"
  become: false
  changed_when: true
  no_log: true

- name: ca.crt sur bastion
  ansible.builtin.copy:
    content: "{{ ocp_registry_ca_pem }}\n"
    dest: "{{ bastion_lab_dir }}/ca.crt"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0644"

- name: Trust registry pour oc-mirror / curl
  when: ocp_configure_registry_trust | bool
  block:
    - name: certs.d registry
      ansible.builtin.file:
        path: "/etc/containers/certs.d/{{ ocp_registry_fqdn }}:{{ ocp_registry_port }}"
        state: directory
        mode: "0755"
    - name: CA dans certs.d
      ansible.builtin.copy:
        content: "{{ ocp_registry_ca_pem }}\n"
        dest: "/etc/containers/certs.d/{{ ocp_registry_fqdn }}:{{ ocp_registry_port }}/ca.crt"
        mode: "0644"
    - name: CA system trust
      ansible.builtin.copy:
        content: "{{ ocp_registry_ca_pem }}\n"
        dest: /etc/pki/ca-trust/source/anchors/registry-lab.crt
        mode: "0644"
    - name: update-ca-trust
      ansible.builtin.command: update-ca-trust extract
      changed_when: true

- name: Rappel ISO agent
  ansible.builtin.debug:
    msg: >-
      Configs déployées dans {{ ocp_config_backup_dir }}.
      Générer l'ISO sur la bastion :
      cd {{ ocp_install_dir }} && rm -rf .openshift_install_state.json agent.x86_64.iso cluster-manifests auth &&
      cp config-backup/*.yaml . &&
      openshift-install agent create cluster-manifests --dir . &&
      openshift-install agent create image --dir . &&
      cp config-backup/*.yaml .
      (ou ocp_agent_generate_iso: true)
  when: not (ocp_agent_generate_iso | bool)

# Clean BEFORE manifests — stale ClusterImageSet / auth/kubeconfig from a prior
# cluster break create image and leave oc pointing at the old CA after reinstall.
- name: Clean previous installer state before ISO
  ansible.builtin.file:
    path: "{{ ocp_install_dir }}/{{ item }}"
    state: absent
  loop: "{{ ocp_iso_clean_paths }}"
  when: ocp_agent_generate_iso | bool

- name: Restaurer configs avant create manifests
  ansible.builtin.copy:
    src: "{{ ocp_config_backup_dir }}/{{ item }}"
    dest: "{{ ocp_install_dir }}/{{ item }}"
    remote_src: true
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"
  loop:
    - install-config.yaml
    - agent-config.yaml
  when: ocp_agent_generate_iso | bool

- name: openshift-install agent create cluster-manifests
  become: true
  become_user: "{{ lab_user }}"
  ansible.builtin.command:
    cmd: openshift-install agent create cluster-manifests --dir {{ ocp_install_dir }}
    chdir: "{{ ocp_install_dir }}"
  when: ocp_agent_generate_iso | bool
  register: ocp_manifests
  changed_when: ocp_manifests.rc == 0

- name: openshift-install agent create image
  become: true
  become_user: "{{ lab_user }}"
  ansible.builtin.command:
    cmd: openshift-install agent create image --dir {{ ocp_install_dir }} --log-level info
    chdir: "{{ ocp_install_dir }}"
  when: ocp_agent_generate_iso | bool
  register: ocp_image
  changed_when: ocp_image.rc == 0
  async: 3600
  poll: 30

- name: Restaurer configs après create image
  ansible.builtin.copy:
    src: "{{ ocp_config_backup_dir }}/{{ item }}"
    dest: "{{ ocp_install_dir }}/{{ item }}"
    remote_src: true
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"
  loop:
    - install-config.yaml
    - agent-config.yaml
  when: ocp_agent_generate_iso | bool

- name: Vérifier présence agent ISO sur bastion
  ansible.builtin.stat:
    path: "{{ ocp_install_dir }}/{{ ocp_proxmox_iso_filename }}"
  register: ocp_agent_iso_stat
  when: ocp_push_iso_to_proxmox | bool

- name: Read bastion pubkey for Proxmox authorize
  when:
    - ocp_push_iso_to_proxmox | bool
    - ocp_agent_iso_stat.stat.exists | default(false)
  ansible.builtin.slurp:
    src: "/home/{{ lab_user }}/.ssh/id_ed25519.pub"
  register: ocp_bastion_pubkey_slurp

- name: Authorize bastion key on Proxmox (ISO scp)
  when:
    - ocp_push_iso_to_proxmox | bool
    - ocp_agent_iso_stat.stat.exists | default(false)
  ansible.builtin.shell: |
    set -euo pipefail
    KEY={{ ocp_bastion_pubkey_slurp.content | b64decode | trim | quote }}
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
      "root@{{ ocp_proxmox_host }}" \
      "umask 077; mkdir -p /root/.ssh; touch /root/.ssh/authorized_keys;
       grep -qxF \"${KEY}\" /root/.ssh/authorized_keys || echo \"${KEY}\" >> /root/.ssh/authorized_keys"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false

- name: Copier agent ISO vers NFS Proxmox
  become: true
  become_user: "{{ lab_user }}"
  ansible.builtin.command:
    argv:
      - scp
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=accept-new
      - "{{ ocp_install_dir }}/{{ ocp_proxmox_iso_filename }}"
      - "root@{{ ocp_proxmox_host }}:{{ ocp_proxmox_iso_dir }}/"
  when:
    - ocp_push_iso_to_proxmox | bool
    - ocp_agent_iso_stat.stat.exists | default(false)
  register: ocp_iso_scp
  changed_when: ocp_iso_scp.rc == 0

- name: ISO absente — skip push Proxmox
  ansible.builtin.debug:
    msg: >-
      ocp_push_iso_to_proxmox=true mais {{ ocp_install_dir }}/{{ ocp_proxmox_iso_filename }}
      introuvable — générer avec ocp_agent_generate_iso ou openshift-install create image
  when:
    - ocp_push_iso_to_proxmox | bool
    - not (ocp_agent_iso_stat.stat.exists | default(false))
