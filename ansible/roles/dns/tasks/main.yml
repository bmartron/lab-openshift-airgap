---
- name: Repos RHEL DVD (air-gap, dnsmasq)
  ansible.builtin.include_role:
    name: rhel_dvd
  when: rhel_dvd_repo_enable | default(true) | bool

- name: Paquets DNS
  ansible.builtin.dnf:
    name:
      - dnsmasq
      - bind-utils
    state: present

- name: chrony serveur NTP lab
  ansible.builtin.copy:
    dest: /etc/chrony.d/lab.conf
    mode: "0644"
    content: |
      allow 172.16.10.0/24
      cmdallow 172.16.10.0/24
      local stratum 10
      rtcsync
      makestep 1.0 3
  notify: restart chronyd

- name: Désactiver pools externes chrony (air-gap)
  ansible.builtin.replace:
    path: /etc/chrony.conf
    regexp: '^(pool|server) '
    replace: '#\1 '
  notify: restart chronyd

- name: Firewall DNS + NTP
  ansible.builtin.command: "firewall-cmd --permanent --add-service={{ item }}"
  loop:
    - dns
    - ntp
  register: fw_add
  changed_when: "'ALREADY_ENABLED' not in fw_add.stdout"
  failed_when: fw_add.rc != 0 and 'ALREADY_ENABLED' not in fw_add.stdout

- name: Firewall reload
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Répertoire drop-in systemd dnsmasq
  ansible.builtin.file:
    path: /etc/systemd/system/dnsmasq.service.d
    state: directory
    mode: "0755"

- name: dnsmasq after network (avoid boot race)
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnsmasq.service.d/after-network.conf
    mode: "0644"
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      Restart=on-failure
      RestartSec=5
  notify:
    - reload systemd
    - restart dnsmasq

- name: Deploy /etc/dnsmasq.conf (lab records)
  when: dns_deploy_dnsmasq_conf | default(true) | bool
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: dnsmasq started and enabled
  ansible.builtin.service:
    name: dnsmasq
    state: started
    enabled: true
