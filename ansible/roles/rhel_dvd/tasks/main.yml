---
- name: Répertoire montage DVD RHEL
  ansible.builtin.file:
    path: "{{ rhel_dvd_mount }}"
    state: directory
    mode: "0755"

# cloud-init (ide0) = souvent /dev/sr0 (cidata) ; DVD repo (ide2) = /dev/sr1
- name: Résoudre le lecteur DVD RHEL (BaseOS+AppStream, pas cidata)
  ansible.builtin.shell: |
    set -euo pipefail
    probe() {
      local d="$1" m
      m=$(mktemp -d)
      if mount -o ro "$d" "$m" 2>/dev/null; then
        if [ -d "$m/BaseOS" ] && [ -d "$m/AppStream" ]; then
          umount "$m"
          rmdir "$m"
          echo "$d"
          return 0
        fi
        umount "$m" || true
      fi
      rmdir "$m" 2>/dev/null || true
      return 1
    }
    # Prefer explicit device if it is the RHEL DVD
    if [ -n "{{ rhel_dvd_device }}" ] && [ -b "{{ rhel_dvd_device }}" ]; then
      if probe "{{ rhel_dvd_device }}"; then
        exit 0
      fi
    fi
    for d in /dev/sr*; do
      [ -b "$d" ] || continue
      if probe "$d"; then
        exit 0
      fi
    done
    echo "Aucun /dev/sr* avec BaseOS+AppStream — attacher rhel_dvd_iso (ide2) dans Proxmox" >&2
    exit 1
  args:
    executable: /bin/bash
  register: rhel_dvd_resolved
  changed_when: false

- name: Périphérique DVD retenu
  ansible.builtin.set_fact:
    rhel_dvd_device_effective: "{{ rhel_dvd_resolved.stdout | trim }}"

# Évite de garder /mnt/rhel monté sur cidata (sr0) après un premier échec
- name: Contenu actuel du point de montage
  ansible.builtin.stat:
    path: "{{ rhel_dvd_mount }}/BaseOS"
  register: rhel_mount_baseos_before

- name: Démonter si le point n'est pas le DVD RHEL
  ansible.builtin.mount:
    path: "{{ rhel_dvd_mount }}"
    state: absent
  when: not (rhel_mount_baseos_before.stat.exists | default(false))

- name: Monter DVD/ISO RHEL ({{ rhel_dvd_device_effective }})
  ansible.builtin.mount:
    path: "{{ rhel_dvd_mount }}"
    src: "{{ rhel_dvd_device_effective }}"
    fstype: iso9660
    opts: ro,defaults
    state: mounted

- name: Vérifier contenu DVD (BaseOS + AppStream)
  ansible.builtin.stat:
    path: "{{ rhel_dvd_mount }}/{{ item }}"
  register: rhel_dvd_tree
  loop:
    - BaseOS
    - AppStream

- name: ISO RHEL complète requise (air-gap)
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      {{ item.item }} absent sous {{ rhel_dvd_mount }} — attacher le DVD RHEL complet
      dans Proxmox (ide2) puis relancer. Voir rhel/dvd-repo.md
  loop: "{{ rhel_dvd_tree.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Désactiver plugin subscription-manager pour DNF
  ansible.builtin.copy:
    dest: /etc/dnf/plugins/subscription-manager.conf
    mode: "0644"
    content: |
      [main]
      enabled=0

- name: RHSM ne gère pas les repos DNF
  ansible.builtin.command: subscription-manager config --rhsm.manage_repos=0
  register: rhsm_repos
  changed_when: "'manage_repos: 0' in rhsm_repos.stdout or rhsm_repos.rc == 0"
  failed_when: false

- name: Repos locaux DVD
  ansible.builtin.template:
    src: rhel-dvd.repo.j2
    dest: /etc/yum.repos.d/rhel-dvd.repo
    mode: "0644"

- name: Lister fichiers repo DNF
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "*.repo"
  register: rhel_dvd_repo_files

- name: Désactiver repos CDN/RHSM (air-gap, hors rhel-dvd.repo)
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^enabled\s*=\s*1'
    replace: 'enabled=0'
  loop: "{{ rhel_dvd_repo_files.files }}"
  when: item.path | basename != 'rhel-dvd.repo'
  loop_control:
    label: "{{ item.path | basename }}"

- name: Rafraîchir métadonnées DNF
  ansible.builtin.command: dnf clean all
  changed_when: true

- name: Vérifier AppStream visible
  ansible.builtin.command: dnf repolist --enabled
  register: rhel_repolist
  changed_when: false

- name: AppStream doit être listé
  ansible.builtin.assert:
    that:
      - rhel_repolist.stdout is search('appstream|AppStream', ignorecase=True)
    fail_msg: "AppStream introuvable — vérifier ISO et {{ rhel_dvd_mount }}"
