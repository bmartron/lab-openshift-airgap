---
- name: Repos RHEL DVD (air-gap, podman/openssl)
  ansible.builtin.include_role:
    name: rhel_dvd
  when: rhel_dvd_repo_enable | default(true) | bool

- name: chrony client vers DNS lab
  ansible.builtin.copy:
    dest: /etc/chrony.d/lab.conf
    mode: "0644"
    content: |
      server {{ lab_ntp_server }} iburst
      makestep 1.0 3
  notify: restart chronyd

- name: Disque données registry (optionnel)
  ansible.builtin.include_tasks: data_disk.yml
  when: registry_data_device | default('') | length > 0

- name: Arborescence registry
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ registry_data_mount }}/data"
    - "{{ registry_data_mount }}/certs"

- name: Paquets registry
  ansible.builtin.dnf:
    name:
      - podman
      - openssl
    state: present

- name: Certificats TLS
  ansible.builtin.include_tasks: certs.yml
  when: registry_tls_mode != 'skip'

- name: Image registry:2 (air-gap)
  ansible.builtin.include_tasks: image.yml
  when: registry_deploy_container | default(true) | bool

- name: Conteneur Podman
  ansible.builtin.include_tasks: container.yml
  when: registry_deploy_container | bool
