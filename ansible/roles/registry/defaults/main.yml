---
registry_hostname: registry.lab.local
registry_port: 5000
registry_data_mount: /opt/registry
registry_data_device: ""

registry_container_name: ocp-registry
registry_image: docker.io/library/registry:2

# registry_image_tar: required in inventory/group_vars/all.yml (no empty default)

registry_tls_mode: generate # generate | copy | skip
registry_regenerate_certs: false

registry_deploy_container: true
registry_recreate_container: false
