---
# Ensure bernard@bastion can SSH as root@Proxmox (agent ISO scp).
# Runs from the Mac controller (already has root@pve for ProxyJump).

- name: Ensure SSH directory for lab user
  ansible.builtin.file:
    path: "/home/{{ lab_user }}/.ssh"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0700"

- name: Ensure ed25519 key for lab user (SNO sshKey + Proxmox scp)
  become: true
  become_user: "{{ lab_user }}"
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -f /home/{{ lab_user }}/.ssh/id_ed25519
    creates: "/home/{{ lab_user }}/.ssh/id_ed25519"

- name: Read bastion public key
  ansible.builtin.slurp:
    src: "/home/{{ lab_user }}/.ssh/id_ed25519.pub"
  register: bastion_proxmox_pubkey_slurp

- name: Authorize bastion pubkey on Proxmox root
  when: bastion_authorize_proxmox_ssh | default(true) | bool
  ansible.builtin.shell: |
    set -euo pipefail
    KEY={{ bastion_proxmox_pubkey_slurp.content | b64decode | trim | quote }}
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
      "root@{{ bastion_proxmox_host }}" \
      "umask 077; mkdir -p /root/.ssh; touch /root/.ssh/authorized_keys;
       grep -qxF \"${KEY}\" /root/.ssh/authorized_keys || echo \"${KEY}\" >> /root/.ssh/authorized_keys"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: bastion_proxmox_auth
  changed_when: false
  failed_when: bastion_proxmox_auth.rc != 0
